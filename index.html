<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High Accuracy Real-Time Object Detection</title>

  <!-- Load TensorFlow.js and COCO-SSD -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin-bottom: 8px;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      margin-bottom: 20px;
    }
    #status {
      font-weight: bold;
      color: #f59e0b;
      margin-bottom: 15px;
    }
    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
      background-color: #1e293b;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    label {
      font-size: 14px;
      color: #cbd5e1;
    }
    input[type=range] {
      vertical-align: middle;
    }
    .video-container {
      position: relative;
      width: 1280px;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 2px solid #334155;
      background-color: #1e293b;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    button {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      background-color: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h1>High Accuracy Object Detection</h1>
  <p>Uses MobileNet v2 backbone and HD resolution to maximize detection accuracy.</p>
  <div id="status">Loading High-Accuracy Model...</div>

  <div class="controls">
    <button id="toggleBtn" disabled>Enable Camera</button>
    <label for="threshold">
      Min Confidence: <span id="thresholdVal">55</span>%
    </label>
    <input type="range" id="threshold" min="30" max="90" value="55" step="5">
  </div>

  <div class="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const toggleBtn = document.getElementById('toggleBtn');
    const thresholdSlider = document.getElementById('threshold');
    const thresholdVal = document.getElementById('thresholdVal');

    let model = null;
    let isDetecting = false;
    let animationFrameId = null;
    let minConfidence = 0.55;

    thresholdSlider.addEventListener('input', (e) => {
      minConfidence = e.target.value / 100;
      thresholdVal.innerText = e.target.value;
    });

    // Load model using MobileNet v2 backbone for significantly better accuracy
    async function loadModel() {
      try {
        model = await cocoSsd.load({
          base: 'mobilenet_v2' // Upgrade from default lite backbone to full mobilenet_v2
        });
        statusDiv.innerText = "Model Loaded (MobileNet V2)! Ready to detect.";
        statusDiv.style.color = "#10b981";
        toggleBtn.disabled = false;
      } catch (error) {
        statusDiv.innerText = "Error loading model. Check internet connection.";
        statusDiv.style.color = "#ef4444";
        console.error(error);
      }
    }

    toggleBtn.addEventListener('click', async () => {
      if (!isDetecting) {
        try {
          // Request HD resolution (1280x720) for sharper details
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { 
              width: { ideal: 1280 }, 
              height: { ideal: 720 },
              facingMode: "user" 
            },
            audio: false
          });
          video.srcObject = stream;
          video.addEventListener('loadedmetadata', () => {
            // Match canvas dimensions exactly to HD video stream
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            isDetecting = true;
            toggleBtn.innerText = "Stop Camera";
            detectObjects();
          });
        } catch (err) {
          alert("Camera access denied or webcam incompatible with HD capture.");
          console.error(err);
        }
      } else {
        stopCamera();
      }
    });

    function stopCamera() {
      isDetecting = false;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      
      const stream = video.srcObject;
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      toggleBtn.innerText = "Enable Camera";
    }

    async function detectObjects() {
      if (!isDetecting) return;

      // Filter predictions based on minimum confidence slider
      const predictions = await model.detect(video, 10, minConfidence);
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      predictions.forEach(prediction => {
        const [x, y, width, height] = prediction.bbox;
        const scorePercent = Math.round(prediction.score * 100);
        const label = `${prediction.class} (${scorePercent}%)`;

        // Bounding box styling
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 4;
        ctx.strokeRect(x, y, width, height);

        // Text label container background
        ctx.fillStyle = '#00ff88';
        ctx.font = 'bold 18px sans-serif';
        const textWidth = ctx.measureText(label).width;
        ctx.fillRect(x, y > 28 ? y - 28 : y, textWidth + 12, 28);

        // Text label color
        ctx.fillStyle = '#000000';
        ctx.fillText(label, x + 6, y > 28 ? y - 8 : y + 20);
      });

      animationFrameId = requestAnimationFrame(detectObjects);
    }

    loadModel();
  </script>
</body>
</html>
